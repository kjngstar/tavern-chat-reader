plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.kjngstar.tavernchatreader'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.kjngstar.tavernchatreader'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.0.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
